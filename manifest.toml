#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "wishlist"
name = "Wishlist"
description.en = "Wishlist that you can share with your friends and family."
description.fr = "Liste de souhaits que vous pouvez partager avec vos amis et votre famille."

version = "0.69.0~ynh1"

maintainers = ["CodeShakingSheep"]

[upstream]
license = "MIT"
code = "https://github.com/cmintey/wishlist"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/wishlist"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["fr", "en"]
    default = "en"

    [install.currency]
    ask.en = "Choose the application currency"
    ask.fr = "Choisissez la devise de l'application"
    type = "select"
    choices = ["EUR", "USD"]
    default = "EUR"

    [install.admin]
    type = "user"

    [install.password]
    help.en = "Use the help field to add an information for the admin about this question."
    help.fr = "Utilisez le champ aide pour ajouter une information à l'intention de l'administrateur à propos de cette question."
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/cmintey/wishlist/archive/refs/tags/v0.69.0.tar.gz"
    sha256 = "f39c07db0f7a8467372bfcfdd7f5d59c035a9bd4e522996db17509bde005059c"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 3280

    [resources.apt]
    packages = "nginx"

    [resources.nodejs]
    version = "24"