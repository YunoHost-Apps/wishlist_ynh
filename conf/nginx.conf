location __PATH__/ {

  proxy_pass http://127.0.0.1:__PORT__;
  include proxy_params_no_auth;
  proxy_read_timeout 1d;

  # Everything except SSE endpoints
  gzip on;
  gzip_types *;
}

# Handles User Images
location __PATH__/api/assets/ {
  alias __INSTALL_DIR__/uploads/;

  # Cache static assets for one year
  location ~* \.(ico|css|js|gif|jpg|jpeg|png|svg|woff|woff2|webp)$ {
    more_set_headers "Cache-Control: max-age=31536000";
    expires off;
  }
}

# SSE endpoints: no gzip, no buffering
location ~ ^/(wishlists/[^/]+/events|lists/[^/]+/events)$ {
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_buffering off;
  proxy_cache off;
  gzip off;
}